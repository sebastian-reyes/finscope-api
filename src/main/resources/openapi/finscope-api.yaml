openapi: 3.0.3
info:
  title: FinScope API
  description: |
    API reactiva de FinScope para la gestion de finanzas personales.

    El modelo se reduce a cuatro piezas: la transaccion, su tipo, su categoria y sus
    tags.
    El tipo es un catalogo cerrado de dos valores, ingreso y egreso, porque de el
    depende el signo del importe.

    La categoria y los tags responden preguntas distintas y no son intercambiables. La
    categoria dice en que se gasto y es exactamente una por transaccion, de modo que la
    suma por categoria coincide con el total del periodo y puede repartirse en
    porcentajes. Los tags dicen con quien, para que o en que contexto ocurrio el gasto,
    son cero o varios por transaccion y por tanto se solapan: sus importes nunca reparten
    un total. Ambos son catalogos del usuario, editables y compartidos entre sus
    transacciones.

    El presupuesto es la unica pieza que mira hacia delante: fija cuanto se piensa
    gastar en una categoria durante un mes natural y se compara con lo que de verdad
    se gasto en ella. Vive aparte de las transacciones porque es un plan y no un
    hecho: borrar un movimiento no borra la intencion de gastar.

    El movimiento fijo tambien mira hacia delante, pero de otra forma: es una plantilla
    que dice que un cargo o un ingreso vuelve cada cierto tiempo. No genera nada solo.
    Cada mes produce un pendiente que el usuario confirma, y esa confirmacion es la que
    crea la transaccion, porque un historial que se inventa movimientos deja de servir
    para lo unico que sirve, que es saber que paso. Lo que aun no se ha confirmado si
    cuenta como comprometido contra el presupuesto de su categoria: cuatrocientos
    presupuestados con ciento ochenta de internet todavia por pagar no son
    cuatrocientos disponibles.

    El presupuesto y el movimiento fijo llevan tambien la suya, y por el mismo motivo: un
    plan es una cantidad de una moneda concreta. Una categoria puede por tanto tener dos
    presupuestos en el mismo mes, uno por moneda, porque ninguno resume al otro. Cada uno
    cuenta solo lo gastado y lo comprometido en su moneda, de modo que no hay nada que
    convertir en ningun sitio.

    Cada transaccion lleva su propia moneda y se guarda en ella, sin convertirse nunca:
    cien dolares son cien dolares el dia que se registran y el dia que se consultan. Las
    transacciones en una moneda distinta de la base guardan ademas el tipo de cambio con
    el que se apuntaron, que es memoria de aquel dia y no participa en ningun calculo. Por
    eso los totales no suman monedas distintas: las separan.

    Todos los recursos financieros pertenecen al usuario autenticado y estan aislados
    entre usuarios. Salvo los endpoints de autenticacion, todas las operaciones exigen
    un token de acceso.
  version: 6.7.0
servers:
  - url: /
    description: Servidor local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Registro, autenticacion y renovacion de credenciales
  - name: transaction-types
    description: Consulta de tipos de transaccion
  - name: transactions
    description: Gestion y consulta de transacciones
  - name: categories
    description: Gestion del catalogo de categorias del usuario
  - name: tags
    description: Gestion del catalogo de tags del usuario
  - name: budgets
    description: Presupuesto mensual por categoria y su avance
  - name: recurring
    description: Movimientos que se repiten y su confirmacion mes a mes
  - name: summary
    description: Agregados financieros calculados sobre las transacciones

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registra un usuario nuevo
      description: |
        Crea la cuenta y devuelve directamente las credenciales, de modo que el registro y
        el inicio de sesion son una sola llamada desde el cliente movil.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      tags: [auth]
      summary: Inicia sesion
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales emitidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: [auth]
      summary: Renueva el token de acceso
      description: |
        Consume el token de refresco indicado y emite un par nuevo. El token consumido queda
        revocado, de modo que un token robado deja de servir en cuanto el usuario legitimo
        renueva.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Credenciales renovadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [auth]
      summary: Cierra la sesion revocando el token de refresco
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Sesion cerrada
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/me:
    get:
      tags: [auth]
      summary: Devuelve el usuario autenticado
      operationId: getCurrentUser
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [auth]
      summary: Actualiza los datos del usuario autenticado
      description: |
        Cambia el nombre con el que el usuario se presenta. El correo no se toca aqui: es
        la credencial con la que se entra, y cambiarlo obligaria a rehacer la identidad
        local y a reemitir las credenciales, que es otra operacion.
        Como en el resto de la API, un campo ausente se deja como esta; el nombre en blanco
        si es un cambio, y lo deja sin poner, que es el estado con el que puede nacer una
        cuenta.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/verify-email:
    post:
      tags: [auth]
      summary: Envia el correo de verificacion al usuario autenticado
      description: |
        Emite un enlace de un solo uso y lo manda a la direccion de la cuenta. Responde 202
        antes de que el correo salga: entregarlo depende de un tercero y no debe decidir si
        la peticion salio bien.
        Sobre una cuenta ya verificada no hace nada y responde igual, para no convertir la
        respuesta en una forma de averiguar el estado de otra cuenta.
      operationId: sendEmailVerification
      responses:
        "202":
          description: Correo de verificacion encolado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/verify-email/confirm:
    post:
      tags: [auth]
      summary: Da por verificado el correo de una cuenta
      description: |
        Consume el enlace recibido por correo. Es publico porque el enlace puede abrirse en
        un navegador distinto de aquel en el que se pidio; el token es la credencial.
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTokenRequest"
      responses:
        "204":
          description: Correo verificado
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/change-email:
    post:
      tags: [auth]
      summary: Solicita el cambio de correo del usuario autenticado
      description: |
        Pide la contrasena en curso y manda un enlace a la direccion nueva. El correo de la
        cuenta no cambia aqui: sigue siendo el viejo hasta que se confirma ese enlace, de
        modo que una direccion mal escrita no deja la cuenta sin acceso.
        A la direccion anterior se le avisa del intento, que es como se entera el dueno
        legitimo si alguien mas ha entrado a su sesion.
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "202":
          description: Correo de confirmacion encolado
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/change-email/confirm:
    post:
      tags: [auth]
      summary: Aplica el cambio de correo pendiente
      description: |
        Consume el enlace mandado a la direccion nueva y la pone como correo de la cuenta,
        ya verificada: acaba de demostrarse que se recibe en ella. La identidad local se
        actualiza con el correo nuevo, que es el que servira para entrar.
      operationId: confirmEmailChange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTokenRequest"
      responses:
        "204":
          description: Correo cambiado
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Pide un enlace para restablecer la contrasena
      description: |
        Responde 202 siempre, exista o no una cuenta con ese correo. Distinguir los dos
        casos convertiria este endpoint en una lista de quien esta registrado.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Si hay cuenta para ese correo, el enlace va en camino
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Establece una contrasena nueva con el enlace recibido
      description: |
        Consume el enlace y cambia la contrasena. Cierra ademas todas las sesiones abiertas:
        quien restablece la contrasena suele hacerlo porque sospecha que otro la tiene, y
        dejar vivos los tokens de refresco ya emitidos dejaria dentro a ese otro.
        Al hacerlo se da tambien por verificado el correo, porque acaba de demostrarse que
        se recibe en el.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Contrasena establecida
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /transaction-types:
    get:
      tags: [transaction-types]
      summary: Lista los tipos de transaccion
      description: |
        Catalogo global cerrado de dos elementos, ingreso y egreso. El cliente deberia
        apoyarse en el campo code y no en el identificador numerico.
      operationId: listTransactionTypes
      responses:
        "200":
          description: Listado de tipos de transaccion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionTypeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /transaction-types/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [transaction-types]
      summary: Obtiene un tipo de transaccion por su identificador
      operationId: getTransactionTypeById
      responses:
        "200":
          description: Tipo de transaccion encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionTypeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /categories:
    get:
      tags: [categories]
      summary: Lista las categorias del usuario
      description: |
        Devuelve el catalogo completo de categorias del usuario, ordenado alfabeticamente,
        con el numero de transacciones que clasifica cada una.
        El catalogo se siembra al registrarse con un juego inicial de categorias y desde
        ahi es del usuario: puede anadir, renombrar y eliminar las que quiera.
      operationId: listCategories
      responses:
        "200":
          description: Listado de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [categories]
      summary: Crea una categoria
      description: |
        El nombre debe estar libre dentro del catalogo del usuario sin distinguir
        mayusculas, igual que en los tags.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCategoryRequest"
      responses:
        "201":
          description: Categoria creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [categories]
      summary: Actualiza una categoria
      description: |
        Cambia el nombre o el tipo de movimiento al que se ofrece la categoria. El cambio
        alcanza a todas las transacciones que clasifica, porque la categoria es una sola y
        se comparte entre ellas.
        Los campos ausentes se dejan como estan. Renombrar a un nombre ya ocupado se
        rechaza en lugar de fusionar las dos categorias, para que la operacion nunca
        destruya informacion sin avisar.
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCategoryRequest"
      responses:
        "200":
          description: Categoria actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [categories]
      summary: Elimina una categoria
      description: |
        Elimina la categoria del catalogo. Las transacciones que clasificaba pasan a la
        categoria de reserva del usuario, la marcada con isSystem: como toda transaccion
        tiene exactamente una categoria, no pueden quedarse sin ninguna.
        La categoria de reserva no se puede eliminar.
      operationId: deleteCategory
      responses:
        "204":
          description: Categoria eliminada
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /tags:
    get:
      tags: [tags]
      summary: Lista los tags del usuario
      description: |
        Devuelve el catalogo completo de tags del usuario, ordenado alfabeticamente, con el
        numero de transacciones que lleva cada uno. Sirve para ofrecer autocompletado al
        escribir y para administrar el catalogo.
        Se incluyen los tags que todavia no usa ninguna transaccion, con transactionCount a
        cero: siguen ocupando su nombre, asi que el usuario debe poder verlos y borrarlos.
      operationId: listTags
      responses:
        "200":
          description: Listado de tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [tags]
      summary: Crea un tag en el catalogo del usuario
      description: |
        Alta explicita de un tag, para preparar el catalogo sin registrar una transaccion.
        No es la via habitual: los tags siguen naciendo al escribirlos dentro de una.
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTagRequest"
      responses:
        "201":
          description: Tag creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /tags/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [tags]
      summary: Renombra un tag
      description: |
        Cambia el nombre del tag en todas las transacciones que lo llevan, porque el tag es
        uno solo y se comparte entre ellas.
        El nombre debe seguir libre dentro del catalogo del usuario sin distinguir
        mayusculas: renombrar a un nombre ya existente se rechaza en lugar de fusionar los
        dos tags, para que la operacion nunca destruya informacion sin avisar.
      operationId: updateTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTagRequest"
      responses:
        "200":
          description: Tag renombrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [tags]
      summary: Elimina un tag
      description: |
        Elimina el tag del catalogo y lo retira de todas las transacciones que lo llevan.
        Las transacciones no se tocan: solo dejan de estar clasificadas por el.
      operationId: deleteTag
      responses:
        "204":
          description: Tag eliminado
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /transactions:
    get:
      tags: [transactions]
      summary: Lista transacciones filtradas y paginadas
      description: |
        Todos los filtros son opcionales y se combinan con AND.
        Los parametros month y year son un atajo para acotar a un mes natural completo
        y no pueden combinarse con dateFrom o dateTo.
      operationId: listTransactions
      parameters:
        - $ref: "#/components/parameters/MonthFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DateFromFilter"
        - $ref: "#/components/parameters/DateToFilter"
        - $ref: "#/components/parameters/TransactionTypeIdFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/SearchFilter"
        - $ref: "#/components/parameters/CurrencyFilter"
        - name: page
          in: query
          description: Numero de pagina, empezando en cero
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Cantidad de elementos por pagina
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            Criterio de ordenamiento con formato campo,direccion.
            Campos admitidos date, amount e id. Direcciones asc y desc.
          required: false
          schema:
            type: string
            default: date,desc
      responses:
        "200":
          description: Pagina de transacciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [transactions]
      summary: Crea una transaccion
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaccion creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /transactions/summary:
    get:
      tags: [summary]
      summary: Resume las transacciones que cumplen los filtros
      description: |
        Devuelve los totales de ingresos y egresos del periodo y su desglose por tag, sin
        paginar y sin traerse las transacciones. Acepta exactamente los mismos filtros que
        el listado y los combina igual, de modo que un resumen siempre corresponde con lo
        que devolveria el listado con esos mismos filtros.

        Los importes de byTag no suman el total: una transaccion con varios tags aporta su
        importe integro a cada uno, porque el modelo no define como repartirlo. El cliente
        debe presentarlo como gasto por tag y no como un reparto porcentual del total.

        Ningun total mezcla monedas. Los de primer nivel y los dos desgloses son los de una
        sola: la del parametro currency, o la moneda base si no se indica. Para ver todas
        las del periodo a la vez esta byCurrency, que es lo unico que no acota ese
        parametro.
      operationId: getTransactionSummary
      parameters:
        - $ref: "#/components/parameters/MonthFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DateFromFilter"
        - $ref: "#/components/parameters/DateToFilter"
        - $ref: "#/components/parameters/TransactionTypeIdFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/SearchFilter"
        - $ref: "#/components/parameters/SummaryCurrencyFilter"
      responses:
        "200":
          description: Resumen del periodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /transactions/summary/series:
    get:
      tags: [summary]
      summary: Resume las transacciones agrupadas por tramos de tiempo
      description: |
        Agrupa ingresos y egresos en tramos consecutivos del tamanio indicado por
        granularity, para dibujar la evolucion financiera.
        Solo se devuelven los tramos que tienen alguna transaccion: el cliente conoce el
        rango y la granularidad, asi que puede completar los huecos con ceros sin que el
        servidor tenga que materializar tramos vacios.

        Los tramos son de una sola moneda, la del parametro currency o la base si no se
        indica: una linea que sumara monedas distintas no representaria ninguna cantidad.
      operationId: getTransactionSummarySeries
      parameters:
        - $ref: "#/components/parameters/MonthFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DateFromFilter"
        - $ref: "#/components/parameters/DateToFilter"
        - $ref: "#/components/parameters/TransactionTypeIdFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/SearchFilter"
        - $ref: "#/components/parameters/SummaryCurrencyFilter"
        - name: granularity
          in: query
          description: Tamanio de cada tramo
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/SummaryGranularity"
            default: MONTH
      responses:
        "200":
          description: Serie temporal del periodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarySeriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [transactions]
      summary: Obtiene una transaccion por su identificador
      operationId: getTransactionById
      responses:
        "200":
          description: Transaccion encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [transactions]
      summary: Actualiza parcialmente una transaccion
      description: |
        Solo se modifican los campos presentes en la peticion.
        Si tags esta presente reemplaza por completo los tags de la transaccion;
        si se omite, los tags actuales se conservan.
      operationId: updateTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"
      responses:
        "200":
          description: Transaccion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [transactions]
      summary: Elimina una transaccion
      description: |
        La transaccion se elimina fisicamente junto con sus tags, que no existen fuera
        de ella.
      operationId: deleteTransaction
      responses:
        "204":
          description: Transaccion eliminada
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /budgets:
    get:
      tags: [budgets]
      summary: Lista los presupuestos de un mes
      description: |
        Devuelve el presupuesto de cada categoria para el mes indicado junto a lo que se
        lleva gastado en ella, ordenado alfabeticamente por categoria.

        El gasto es la suma de los egresos de esa categoria dentro del mes natural, que es
        exactamente la misma cifra que devuelve el desglose por categoria de
        /transactions/summary. Si divergieran, la barra de avance y el grafico de reparto
        contarian cosas distintas del mismo periodo.

        Solo aparecen las categorias que tienen presupuesto: no tener presupuesto no es lo
        mismo que tenerlo en cero.
      operationId: listBudgets
      parameters:
        - $ref: "#/components/parameters/BudgetMonth"
        - $ref: "#/components/parameters/BudgetYear"
      responses:
        "200":
          description: Presupuestos del mes con su avance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [budgets]
      summary: Fija el presupuesto de una categoria para un mes
      description: |
        La categoria debe admitir egresos: presupuestar una de solo ingresos no significa
        nada, porque el avance se mide contra lo gastado.
        Cada categoria tiene como mucho un presupuesto por mes; repetirlo se rechaza con un
        conflicto en lugar de sumarse al que ya hubiera.
      operationId: createBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBudgetRequest"
      responses:
        "201":
          description: Presupuesto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /budgets/copy:
    post:
      tags: [budgets]
      summary: Copia los presupuestos de un mes a otro
      description: |
        Lleva al mes destino los presupuestos que tuviera el mes origen, con sus mismos
        importes. Es lo que evita volver a teclear el plan entero cada dia uno.

        Solo se copian las categorias que en el destino todavia no tienen presupuesto: lo
        ya fijado alli manda y no se pisa, de modo que repetir la operacion no cambia nada
        la segunda vez.

        Devuelve el mes destino completo tal y como queda, no solo lo copiado.
      operationId: copyBudgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyBudgetsRequest"
      responses:
        "200":
          description: Presupuestos del mes destino tras la copia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /budgets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [budgets]
      summary: Cambia el importe de un presupuesto
      description: |
        Solo se cambia el importe. La categoria y el mes identifican al presupuesto: para
        moverlo a otra categoria o a otro mes se borra y se crea, que ademas deja claro que
        el avance del mes anterior se queda como estaba.
      operationId: updateBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetRequest"
      responses:
        "200":
          description: Presupuesto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [budgets]
      summary: Quita el presupuesto de una categoria
      description: |
        Retira el plan, no el gasto: las transacciones de esa categoria siguen intactas y
        el mes las sigue contando. La categoria simplemente deja de tener un limite contra
        el que compararse.
      operationId: deleteBudget
      responses:
        "204":
          description: Presupuesto eliminado
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /recurring-transactions:
    get:
      tags: [recurring]
      summary: Lista los movimientos fijos con su estado en un mes
      description: |
        Devuelve todas las plantillas del usuario, activas y pausadas, resueltas contra el
        mes indicado: cuando vence en ese mes, en que estado esta y, si ya se confirmo, con
        que movimiento.

        Se devuelven todas y no solo las que tocan ese mes porque la pantalla de gestion
        necesita verlas siempre; las que no aplican llegan con estado NOT_DUE y quien solo
        quiera el checklist del mes filtra por estado.
      operationId: listRecurringTransactions
      parameters:
        - $ref: "#/components/parameters/RecurringMonth"
        - $ref: "#/components/parameters/RecurringYear"
      responses:
        "200":
          description: Movimientos fijos del usuario con su estado en el mes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringOccurrenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [recurring]
      summary: Da de alta un movimiento fijo
      description: |
        Crea la plantilla. No crea ningun movimiento, ni siquiera el del mes en curso: el
        alta dice que ese cargo se repite, no que ya haya ocurrido.

        La categoria debe admitir el tipo indicado, igual que al registrar un movimiento.
      operationId: createRecurringTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRecurringTransactionRequest"
      responses:
        "201":
          description: Movimiento fijo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /recurring-transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [recurring]
      summary: Modifica un movimiento fijo
      description: |
        Cambia la plantilla de aqui en adelante. Los movimientos que ya se confirmaron con
        ella no se tocan: son hechos, y subir el alquiler en octubre no cambia lo que se
        pago en septiembre.

        Solo se aplican los campos presentes. Devuelve la plantilla, sin el estado de
        ningun mes: ese estado depende del mes que se mire y esta operacion no mira
        ninguno.
      operationId: updateRecurringTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecurringTransactionRequest"
      responses:
        "200":
          description: Movimiento fijo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [recurring]
      summary: Elimina un movimiento fijo
      description: |
        Borra la plantilla y sus omisiones. Los movimientos que se confirmaron con ella se
        quedan, porque ocurrieron; lo unico que pierden es el enlace.

        Para dejar de pagar algo casi siempre es mejor pausarlo poniendo active en false:
        eso conserva el historial de los meses en los que si se pago.
      operationId: deleteRecurringTransaction
      responses:
        "204":
          description: Movimiento fijo eliminado
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /recurring-transactions/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [recurring]
      summary: Confirma el movimiento fijo de un mes
      description: |
        Registra el movimiento del mes indicado y lo deja enlazado a su plantilla. Sin mas
        cuerpo que el mes usa el importe estimado y el dia previsto; con amount o date se
        corrige lo que de verdad se pago, que es el caso del recibo de luz o del que llego
        tarde.

        Falla con conflicto si ese mes ya esta confirmado o si esta omitido, y con 400 si
        el fijo no vence en ese mes. Deshacer una confirmacion es borrar el movimiento:
        entonces el fijo vuelve solo a estar pendiente.
      operationId: confirmRecurringTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRecurringTransactionRequest"
      responses:
        "201":
          description: Movimiento registrado y fijo marcado como pagado en ese mes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringOccurrenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /recurring-transactions/{id}/skip:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [recurring]
      summary: Omite el movimiento fijo en un mes
      description: |
        Marca que ese mes no toca, sin tocar la plantilla ni los demas meses. El fijo deja
        de aparecer como vencido y deja de contar como comprometido contra el presupuesto
        de su categoria, que es lo que hace util la omision: lo que no se va a pagar no
        deberia estar reservando dinero.

        Repetirla no cambia nada. Falla con conflicto si ese mes ya esta confirmado: para
        deshacer eso hay que borrar el movimiento.
      operationId: skipRecurringTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipRecurringTransactionRequest"
      responses:
        "200":
          description: Movimiento fijo omitido en ese mes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringOccurrenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [recurring]
      summary: Deshace la omision de un mes
      description: |
        Devuelve el fijo a pendiente en ese mes. Si no estaba omitido no cambia nada y
        responde igual, de modo que deshacer siempre es seguro.
      operationId: unskipRecurringTransaction
      parameters:
        - $ref: "#/components/parameters/RecurringMonth"
        - $ref: "#/components/parameters/RecurringYear"
      responses:
        "200":
          description: Movimiento fijo de vuelta a pendiente en ese mes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringOccurrenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por /auth/login o /auth/refresh

  parameters:
    PathId:
      name: id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        format: int64
    MonthFilter:
      name: month
      in: query
      description: Mes de la transaccion, entre 1 y 12
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 12
    YearFilter:
      name: year
      in: query
      description: Anio de la transaccion
      required: false
      schema:
        type: integer
        minimum: 1970
        maximum: 9999
    DateFromFilter:
      name: dateFrom
      in: query
      description: Fecha inicial inclusiva
      required: false
      schema:
        type: string
        format: date-time
    DateToFilter:
      name: dateTo
      in: query
      description: Fecha final inclusiva
      required: false
      schema:
        type: string
        format: date-time
    TransactionTypeIdFilter:
      name: transactionTypeId
      in: query
      description: Filtra por tipo de transaccion
      required: false
      schema:
        type: integer
        format: int64
    CategoryIdFilter:
      name: categoryId
      in: query
      description: Filtra por categoria principal
      required: false
      schema:
        type: integer
        format: int64
    BudgetMonth:
      name: month
      in: query
      description: Mes del presupuesto, entre 1 y 12
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
    BudgetYear:
      name: year
      in: query
      description: Anio del presupuesto
      required: true
      schema:
        type: integer
        minimum: 1970
        maximum: 9999
    RecurringMonth:
      name: month
      in: query
      description: Mes contra el que se resuelve el estado del fijo, entre 1 y 12
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
    RecurringYear:
      name: year
      in: query
      description: Anio contra el que se resuelve el estado del fijo
      required: true
      schema:
        type: integer
        minimum: 1970
        maximum: 9999
    TagFilter:
      name: tag
      in: query
      description: |
        Devuelve unicamente las transacciones que llevan el tag indicado.
        La comparacion no distingue mayusculas de minusculas.
      required: false
      schema:
        type: string
        maxLength: 70
    CurrencyFilter:
      name: currency
      in: query
      description: |
        Devuelve unicamente las transacciones de la moneda indicada.
      required: false
      schema:
        $ref: "#/components/schemas/Currency"

    SummaryCurrencyFilter:
      name: currency
      in: query
      description: |
        Moneda de la que se quieren los totales. Omitirlo equivale a pedir los de la moneda
        base, no los de todas: un total que sumara monedas distintas no representaria
        ninguna cantidad.
        No afecta a byCurrency, que siempre trae todas las del periodo.
      required: false
      schema:
        allOf:
          - $ref: "#/components/schemas/Currency"
        default: PEN

    SearchFilter:
      name: search
      in: query
      description: |
        Devuelve unicamente las transacciones que responden al texto indicado, buscandolo en
        su descripcion, en el nombre de su categoria y en el de cualquiera de sus tags.
        La comparacion no distingue mayusculas de minusculas y los comodines del texto se
        tratan como caracteres literales.
      required: false
      schema:
        type: string
        maxLength: 100

  responses:
    BadRequest:
      description: La peticion es sintacticamente invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Las credenciales faltan, han caducado o no son validas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: La operacion entra en conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: El token es valido pero no autoriza esta operacion
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: El cuerpo de la peticion supera el tamano admitido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: |
        Se ha superado el limite de peticiones o se han acumulado demasiados intentos de
        acceso fallidos. La cabecera Retry-After indica cuando puede reintentarse.
      headers:
        Retry-After:
          description: Segundos que deben esperarse antes de reintentar
          schema:
            type: integer
            format: int32
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Longitud minima de 8 caracteres. El maximo de 72 lo impone el algoritmo de
            hashing BCrypt, que ignora los caracteres posteriores.
        displayName:
          type: string
          maxLength: 70

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512

    AuthResponse:
      type: object
      description: Credenciales del usuario autenticado
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Token de acceso que debe enviarse en la cabecera Authorization
        refreshToken:
          type: string
          description: Token de un solo uso para obtener un par nuevo sin volver a autenticarse
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Segundos de validez restantes del token de acceso
        user:
          $ref: "#/components/schemas/UserResponse"

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 70
          description: |
            Nombre con el que el usuario se presenta en la aplicacion. En blanco lo deja
            sin poner.

    AccountTokenRequest:
      type: object
      description: |
        Enlace de un solo uso recibido por correo. Es la unica credencial de las operaciones
        que lo piden, asi que caduca pronto y deja de valer en cuanto se usa.
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512

    ChangeEmailRequest:
      type: object
      description: |
        Direccion a la que se quiere mover la cuenta, junto con la contrasena en curso. Se
        pide la contrasena porque el correo es la credencial de acceso: sin ella, una sesion
        abierta un momento en un ordenador ajeno bastaria para quedarse con la cuenta.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Longitud minima de 8 caracteres. El maximo de 72 lo impone el algoritmo de
            hashing BCrypt, que ignora los caracteres posteriores.

    UserResponse:
      type: object
      required: [id, email, emailVerified]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        emailVerified:
          type: boolean
          description: |
            Si se ha demostrado que la cuenta recibe correo en esa direccion. No condiciona
            el acceso: una cuenta sin verificar funciona igual, pero no podria recuperar la
            contrasena, que es de lo que avisa la aplicacion.
        displayName:
          type: string

    TransactionTypeResponse:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Nombre para mostrar, por ejemplo Ingreso
        code:
          type: string
          description: |
            Codigo estable del tipo. Determina el signo del importe en los calculos.
          enum: [INCOME, EXPENSE]

    CategoryScope:
      type: string
      description: |
        Tipo de movimiento al que se ofrece una categoria. BOTH la ofrece en los dos.
        Solo decide que categorias propone el formulario de registro; no restringe lo que
        ya esta guardado.
      enum: [EXPENSE, INCOME, BOTH]

    CategoryResponse:
      type: object
      description: Categoria del catalogo del usuario
      required: [id, name, appliesTo, isSystem, transactionCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        appliesTo:
          $ref: "#/components/schemas/CategoryScope"
        isSystem:
          type: boolean
          description: |
            Categoria de reserva del usuario. Recibe las transacciones de las categorias
            que se eliminan y por eso no puede eliminarse ella misma.
        transactionCount:
          type: integer
          format: int64
          description: Cuantas transacciones del usuario clasifica esta categoria

    SaveCategoryRequest:
      type: object
      description: Cuerpo de alta y de actualizacion de una categoria
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 70
        appliesTo:
          $ref: "#/components/schemas/CategoryScope"

    Currency:
      type: string
      description: |
        Moneda en la que ocurrio un movimiento, en codigo ISO 4217.
        PEN es la moneda base: es la que se asume cuando no se indica ninguna y la unica
        que no necesita tipo de cambio, porque no se convierte a si misma.
        Anadir una moneda es ampliar este enum y la restriccion equivalente de la base de
        datos; el cliente necesita ademas su simbolo y su formato.
      enum: [PEN, USD]

    CurrencySummaryResponse:
      type: object
      description: Ingresos y egresos acumulados en una moneda dentro del periodo
      required: [currency, income, expense, net, transactionCount]
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        income:
          type: number
          description: Suma de los importes de tipo INCOME en esa moneda, siempre positiva
        expense:
          type: number
          description: Suma de los importes de tipo EXPENSE en esa moneda, siempre positiva
        net:
          type: number
          description: Diferencia entre income y expense, negativa si se gasto de mas
        transactionCount:
          type: integer
          format: int64

    TransactionResponse:
      type: object
      required: [id, amount, currency, date, transactionType, category, tags]
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          description: |
            Importe monetario con dos decimales, siempre positivo, expresado en la moneda
            del campo currency. No se convierte nunca.
        currency:
          $ref: "#/components/schemas/Currency"
        exchangeRate:
          type: number
          nullable: true
          description: |
            Tipo de cambio a moneda base con el que se registro el movimiento. Nulo cuando
            la moneda ya es la base.
            Es memoria de aquel dia y no participa en ningun total: cambiarlo manana no
            cambia lo que costo la compra. Multiplicado por amount da su equivalente en
            moneda base en el momento del registro.
        description:
          type: string
        date:
          type: string
          format: date-time
        transactionType:
          $ref: "#/components/schemas/TransactionTypeResponse"
        category:
          $ref: "#/components/schemas/CategoryResponse"
        tags:
          type: array
          description: Tags de la transaccion, en orden alfabetico
          items:
            type: string

    CreateTransactionRequest:
      type: object
      required: [amount, transactionTypeId, categoryId]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 999999999999.99
          description: Importe en la moneda indicada en currency
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          default: PEN
          description: |
            Moneda del movimiento. No figura entre los obligatorios para que un cuerpo sin
            ella siga siendo valido: significa moneda base, que es lo que significaba antes
            de que este campo existiera.
        exchangeRate:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999.999999
          description: |
            Tipo de cambio a moneda base con el que se registra el movimiento.
            Obligatorio cuando currency no es la moneda base y prohibido cuando lo es: la
            moneda base no se convierte a si misma. Se guarda tal cual y no vuelve a
            tocarse, de modo que el equivalente en soles de una compra no cambia cuando el
            cambio del dia si lo hace.
        description:
          type: string
          maxLength: 255
        date:
          type: string
          format: date-time
          description: Fecha de la transaccion. Si se omite se usa la fecha actual.
        transactionTypeId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
          description: |
            Categoria principal, obligatoria. Debe pertenecer al usuario y admitir el tipo
            de la transaccion.
        tags:
          type: array
          description: |
            Tags de texto libre. Se recortan los espacios sobrantes, se descartan los que
            quedan en blanco y los repetidos se ignoran sin distinguir mayusculas.
            Una cadena vacia no llega a descartarse: la rechaza la longitud minima.
            Si el usuario ya tiene el tag escrito de otra forma se reutiliza el existente,
            asi que `casa` sobre un `Casa` previo devuelve `Casa`.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 70

    UpdateTransactionRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 999999999999.99
          description: Importe en la moneda con la que quede el movimiento
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          description: |
            Moneda con la que queda el movimiento. Manda sobre el tipo de cambio: pasar a
            una moneda que no es la base exige mandar exchangeRate en la misma peticion,
            porque el anterior valia para la moneda anterior, y volver a la base lo borra
            sin necesidad de mandar nada.
        exchangeRate:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999.999999
          description: |
            Tipo de cambio a moneda base con el que se registra el movimiento.
            Obligatorio cuando currency no es la moneda base y prohibido cuando lo es: la
            moneda base no se convierte a si misma. Se guarda tal cual y no vuelve a
            tocarse, de modo que el equivalente en soles de una compra no cambia cuando el
            cambio del dia si lo hace.
        description:
          type: string
          maxLength: 255
        date:
          type: string
          format: date-time
        transactionTypeId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
          description: |
            Cambia la categoria principal. Debe pertenecer al usuario y admitir el tipo
            que tendra la transaccion despues de la actualizacion.
        tags:
          type: array
          description: |
            Si esta presente reemplaza por completo los tags de la transaccion.
            Una lista vacia deja la transaccion sin tags.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 70

    TransactionPageResponse:
      type: object
      description: Pagina de transacciones con sus metadatos de paginacion
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    TagResponse:
      type: object
      description: Tag del catalogo del usuario
      required: [id, name, transactionCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        transactionCount:
          type: integer
          format: int64
          description: Cuantas transacciones del usuario llevan este tag

    SaveTagRequest:
      type: object
      description: Nombre de un tag al crearlo o al renombrarlo
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 70
          description: |
            Se recortan los espacios sobrantes. No puede coincidir con otro tag del mismo
            usuario sin distinguir mayusculas.

    TransactionSummaryResponse:
      type: object
      description: |
        Totales del periodo y sus desgloses por moneda, por categoria y por tag.
        Todos los importes de un mismo nivel hablan de la misma moneda: la del filtro
        currency, o la base si no se indico. La excepcion es byCurrency, que es donde estan
        todas.
      required: [income, expense, net, transactionCount, byCurrency, byCategory, byTag]
      properties:
        income:
          type: number
          description: Suma de los importes de tipo INCOME, siempre positiva
        expense:
          type: number
          description: Suma de los importes de tipo EXPENSE, siempre positiva
        net:
          type: number
          description: Diferencia entre income y expense, negativa si se gasto de mas
        transactionCount:
          type: integer
          format: int64
        byCurrency:
          type: array
          description: |
            Totales de cada moneda presente en el periodo, ordenados con la base primero y
            el resto alfabeticamente. Sus importes no se suman entre si.

            Es el unico campo al que no afecta el filtro currency, y a proposito: de aqui
            sale que monedas hay que ofrecer. Viene vacio cuando el periodo no tiene ningun
            movimiento.
          items:
            $ref: "#/components/schemas/CurrencySummaryResponse"
        byCategory:
          type: array
          description: |
            Desglose por categoria, ordenado de mayor a menor egreso. Como cada
            transaccion tiene exactamente una categoria, sus importes suman el total del
            periodo y pueden presentarse como un reparto porcentual.
          items:
            $ref: "#/components/schemas/CategorySummaryResponse"
        byTag:
          type: array
          description: |
            Desglose por tag, ordenado de mayor a menor egreso. Sus importes no suman el
            total del periodo, porque una transaccion con varios tags aporta su importe
            integro a cada uno. Es un analisis de contexto y no una distribucion del
            gasto: para eso esta byCategory.
          items:
            $ref: "#/components/schemas/TagSummaryResponse"

    CategorySummaryResponse:
      type: object
      description: Ingresos y egresos acumulados por una categoria dentro del periodo
      required: [categoryId, category, income, expense, transactionCount]
      properties:
        categoryId:
          type: integer
          format: int64
        category:
          type: string
          description: Nombre de la categoria
        income:
          type: number
        expense:
          type: number
        transactionCount:
          type: integer
          format: int64

    TagSummaryResponse:
      type: object
      description: Ingresos y egresos acumulados por un tag dentro del periodo
      required: [income, expense, transactionCount]
      properties:
        tag:
          type: string
          nullable: true
          description: Nombre del tag, o nulo para las transacciones que no llevan ninguno
        income:
          type: number
        expense:
          type: number
        transactionCount:
          type: integer
          format: int64

    SummaryGranularity:
      type: string
      description: Tamanio de cada tramo de una serie temporal
      enum: [DAY, WEEK, MONTH]

    SummarySeriesResponse:
      type: object
      description: Evolucion de ingresos y egresos a lo largo del periodo
      required: [granularity, buckets]
      properties:
        granularity:
          $ref: "#/components/schemas/SummaryGranularity"
        buckets:
          type: array
          description: Tramos con alguna transaccion, en orden cronologico
          items:
            $ref: "#/components/schemas/SummaryBucketResponse"

    SummaryBucketResponse:
      type: object
      description: Totales de un tramo de la serie
      required: [periodStart, income, expense, net, transactionCount]
      properties:
        periodStart:
          type: string
          format: date-time
          description: Instante inicial del tramo, inclusivo
        income:
          type: number
        expense:
          type: number
        net:
          type: number
        transactionCount:
          type: integer
          format: int64

    BudgetResponse:
      type: object
      description: |
        Presupuesto de una categoria para un mes, junto a lo que se lleva gastado en ella.
        El plan y la realidad viajan juntos porque por separado no dicen nada: un limite de
        400 solo significa algo al lado de los 340 que ya se fueron.
      required:
        [id, categoryId, category, month, year, currency, amount, spent, committed,
         remaining, available]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        category:
          type: string
          description: Nombre de la categoria presupuestada
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          description: |
            Moneda del plan. Todas las cifras de este presupuesto estan en ella, y solo
            cuentan los movimientos de esa misma moneda: un gasto en dolares no consume un
            presupuesto en soles, porque convertirlo haria depender el avance del dia en que
            se mire.
        amount:
          type: number
          description: Importe presupuestado para el mes
        spent:
          type: number
          description: |
            Egresos de esa categoria dentro del mes, solo los de la moneda del presupuesto.
            Es la misma cifra que el campo expense del desglose por categoria de
            /transactions/summary para el mismo periodo y esa misma moneda.
        committed:
          type: number
          description: |
            Lo que los movimientos fijos de esa categoria van a llevarse este mes y todavia
            no se han llevado: la suma de los que vencen en el mes, estan activos, no estan
            ni confirmados ni omitidos y son de la moneda del presupuesto.

            Es dinero que aun no figura en spent pero que ya tiene dueno. Sin el, un
            presupuesto de 400 con 120 gastados aparenta 280 libres cuando el internet de
            180 sigue sin pagarse.
        remaining:
          type: number
          description: |
            Lo que queda del presupuesto: amount menos spent. Es negativo cuando el gasto
            ya se paso del limite, que es justo el caso que hay que poder ver.
        available:
          type: number
          description: |
            Lo que de verdad queda libre: remaining menos committed. Es el numero con el que
            se decide si se puede gastar algo mas este mes, y tambien puede ser negativo.

    SaveBudgetRequest:
      type: object
      description: Cuerpo de alta de un presupuesto
      required: [categoryId, month, year, amount]
      properties:
        categoryId:
          type: integer
          format: int64
          description: Categoria a presupuestar. Debe admitir egresos.
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
          minimum: 1970
          maximum: 9999
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          default: PEN
          description: |
            Moneda del plan. Una categoria admite un presupuesto por moneda y mes, de modo
            que planear en dolares no pisa lo que ya estuviera planeado en soles.
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Importe presupuestado, siempre mayor que cero

    UpdateBudgetRequest:
      type: object
      description: Cuerpo de actualizacion del importe de un presupuesto
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true

    CopyBudgetsRequest:
      type: object
      description: Peticion de copia de los presupuestos de un mes a otro
      required: [sourceMonth, sourceYear, month, year]
      properties:
        sourceMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: Mes del que se copia
        sourceYear:
          type: integer
          minimum: 1970
          maximum: 9999
          description: Anio del que se copia
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Mes al que se copia
        year:
          type: integer
          minimum: 1970
          maximum: 9999
          description: Anio al que se copia

    RecurringStatus:
      type: string
      description: |
        Estado de un movimiento fijo dentro de un mes concreto. No se guarda: se resuelve
        al leer, mirando si hay un movimiento enlazado en ese mes y si el mes esta omitido.

        NOT_DUE cubre dos casos distintos que para quien mira la lista son el mismo: la
        plantilla esta pausada, o toca cada varios meses y ese no es uno de ellos. El campo
        active distingue cual de los dos.
      enum: [PENDING, OVERDUE, PAID, SKIPPED, NOT_DUE]

    RecurringTransactionResponse:
      type: object
      description: |
        Plantilla de un movimiento que se repite. Dice que ese cargo o ese ingreso vuelve
        cada cierto tiempo, no que haya ocurrido: los hechos siguen siendo las
        transacciones.

        Es lo que devuelven el alta y la modificacion, y va sin estado de ningun mes: el
        estado depende del mes que se mire. Para verla dentro de uno hay que listar ese mes.
      required:
        [id, categoryId, transactionTypeId, description, amount, currency, dayOfMonth,
         everyMonths, startMonth, startYear, active, tags]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        transactionTypeId:
          type: integer
          format: int64
          description: |
            Tipo del movimiento que se repite. Un fijo tambien puede ser un ingreso: el
            sueldo es lo mas recurrente que existe.
        description:
          type: string
          description: Como lo llama el usuario, por ejemplo Alquiler o Internet
        amount:
          type: number
          description: |
            Lo que se suele pagar o cobrar, no lo definitivo. Al confirmar el mes se puede
            corregir, y lo corregido vive en la transaccion; aqui se conserva la estimacion.
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          description: |
            Moneda del cargo. La plantilla no lleva tipo de cambio y no es un olvido: un
            fijo se da de alta hoy y se confirma dentro de meses, asi que el cambio es el
            del dia en que se pague y se pide al confirmar.
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          description: |
            Dia previsto dentro del mes. Se recorta al ultimo dia en los meses cortos: un
            cargo del 31 vence el 28 en febrero.
        everyMonths:
          type: integer
          minimum: 1
          maximum: 12
          description: |
            Cada cuantos meses toca, contando desde el mes de arranque. 1 mensual,
            2 bimestral, 3 trimestral, 12 anual.
        startMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: |
            Mes desde el que aplica. Antes de el no vence nunca, de modo que un fijo dado
            de alta en septiembre no aparece como impagado en enero.
        startYear:
          type: integer
          minimum: 1970
          maximum: 9999
        active:
          type: boolean
          description: |
            Un fijo pausado no vence en ningun mes ni compromete presupuesto, pero conserva
            los meses en los que si se pago. Es lo que hay que usar al dejar de pagar algo,
            en lugar de borrarlo.
        tags:
          type: array
          description: |
            Tags de la plantilla, en orden alfabetico. Son el contexto que la categoria no
            puede dar: la categoria es una y reparte el gasto, y los tags se solapan.
            Se copian al movimiento cada vez que se confirma un mes, de modo que el
            historial sale clasificado igual que si se hubiera registrado a mano.
          items:
            type: string

    RecurringOccurrenceResponse:
      type: object
      description: |
        La plantilla resuelta contra un mes: si vence en el, en que estado esta y, cuando
        ya se confirmo, con que movimiento y por cuanto.

        Plantilla y estado viajan juntos porque por separado no sirven de nada: una lista
        de fijos sin saber cuales faltan no es un checklist, es un catalogo.
      required:
        [id, categoryId, category, transactionTypeId, type, description, amount, currency,
         dayOfMonth, everyMonths, startMonth, startYear, active, tags, month, year, status]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        category:
          type: string
        transactionTypeId:
          type: integer
          format: int64
        type:
          type: string
          enum: [INCOME, EXPENSE]
        description:
          type: string
        amount:
          type: number
          description: Importe estimado de la plantilla, no el que se pago
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          description: |
            Moneda del cargo. La plantilla no lleva tipo de cambio y no es un olvido: un
            fijo se da de alta hoy y se confirma dentro de meses, asi que el cambio es el
            del dia en que se pague y se pide al confirmar.
        dayOfMonth:
          type: integer
        everyMonths:
          type: integer
        startMonth:
          type: integer
        startYear:
          type: integer
        active:
          type: boolean
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Mes contra el que se resolvio el estado
        year:
          type: integer
        dueDate:
          type: string
          format: date
          description: |
            Dia concreto en que vence dentro de ese mes, con el dia ya recortado a la
            longitud del mes. Ausente cuando el estado es NOT_DUE, que es cuando no vence.
        status:
          $ref: "#/components/schemas/RecurringStatus"
        transactionId:
          type: integer
          format: int64
          description: Movimiento con el que se confirmo el mes. Solo viene si esta PAID.
        paidAmount:
          type: number
          description: |
            Importe del movimiento con el que se confirmo. Puede no coincidir con amount:
            esa diferencia entre lo previsto y lo pagado es justo lo que interesa ver.
        paidDate:
          type: string
          format: date-time
          description: Fecha del movimiento con el que se confirmo
        tags:
          type: array
          description: Tags de la plantilla, en orden alfabetico
          items:
            type: string

    SaveRecurringTransactionRequest:
      type: object
      description: Cuerpo de alta de un movimiento fijo
      required:
        [categoryId, transactionTypeId, description, amount, dayOfMonth, startMonth,
         startYear]
      properties:
        categoryId:
          type: integer
          format: int64
          description: Categoria del movimiento. Debe admitir el tipo indicado.
        transactionTypeId:
          type: integer
          format: int64
        description:
          type: string
          minLength: 1
          maxLength: 70
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Importe estimado, siempre mayor que cero
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          default: PEN
          description: |
            Moneda del cargo. Sin tipo de cambio: el de cada mes se pide al confirmarlo.
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
        everyMonths:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
        startMonth:
          type: integer
          minimum: 1
          maximum: 12
        startYear:
          type: integer
          minimum: 1970
          maximum: 9999
        tags:
          type: array
          description: |
            Tags de texto libre que llevara el movimiento cada vez que se confirme un mes.
            Se normalizan igual que en las transacciones: se recortan los espacios, se
            descartan los que quedan en blanco y los repetidos se ignoran sin distinguir
            mayusculas. Si el usuario ya tiene el tag escrito de otra forma se reutiliza el
            existente, asi que `casa` sobre un `Casa` previo devuelve `Casa`.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 70

    UpdateRecurringTransactionRequest:
      type: object
      description: |
        Cuerpo de modificacion de un movimiento fijo. Solo se aplican los campos presentes,
        y el cambio rige de aqui en adelante: los meses ya confirmados no se recalculan.
      properties:
        categoryId:
          type: integer
          format: int64
        transactionTypeId:
          type: integer
          format: int64
        description:
          type: string
          minLength: 1
          maxLength: 70
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          description: |
            Moneda con la que queda el cargo. Rige de aqui en adelante: los meses ya
            confirmados conservan la moneda y el cambio con los que se registraron.
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
        everyMonths:
          type: integer
          minimum: 1
          maximum: 12
        startMonth:
          type: integer
          minimum: 1
          maximum: 12
        startYear:
          type: integer
          minimum: 1970
          maximum: 9999
        active:
          type: boolean
        tags:
          type: array
          description: |
            Si esta presente reemplaza por completo los tags de la plantilla. Una lista
            vacia la deja sin ninguno. Los meses ya confirmados no se recalculan: sus
            movimientos conservan los tags con los que se registraron.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 70

    ConfirmRecurringTransactionRequest:
      type: object
      description: |
        Confirmacion del movimiento fijo de un mes. El mes es obligatorio porque es lo que
        se esta confirmando; lo demas solo hace falta cuando lo real no coincide con lo
        previsto.
      required: [month, year]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
          minimum: 1970
          maximum: 9999
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Importe realmente pagado. Si no viene se usa el de la plantilla.
        exchangeRate:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999.999999
          description: |
            Tipo de cambio del dia en que se paga. Obligatorio cuando la plantilla no esta
            en la moneda base y prohibido cuando lo esta, igual que en cualquier movimiento.
            Es aqui y no en la plantilla porque el cambio de este mes no existia el dia en
            que el fijo se dio de alta.
        date:
          type: string
          format: date-time
          description: |
            Fecha real del movimiento. Si no viene se usa el dia previsto de ese mes, no el
            dia de hoy: confirmar el 3 de octubre el alquiler de septiembre debe registrarlo
            en septiembre o saldria del mes al que pertenece.
        description:
          type: string
          minLength: 1
          maxLength: 70
          description: Texto del movimiento. Si no viene se usa el de la plantilla.

    SkipRecurringTransactionRequest:
      type: object
      description: Mes que se omite
      required: [month, year]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
          minimum: 1970
          maximum: 9999

    ErrorResponse:
      type: object
      description: Respuesta de error estructurada
      required: [timestamp, status, code, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
          description: Codigo estable de negocio, por ejemplo TRANSACTION_NOT_FOUND
        message:
          type: string
