openapi: 3.0.3
info:
  title: FinScope API
  description: |
    API reactiva de FinScope para la gestion de finanzas personales.

    El modelo se reduce a cuatro piezas: la transaccion, su tipo, su categoria y sus
    tags.
    El tipo es un catalogo cerrado de dos valores, ingreso y egreso, porque de el
    depende el signo del importe.

    La categoria y los tags responden preguntas distintas y no son intercambiables. La
    categoria dice en que se gasto y es exactamente una por transaccion, de modo que la
    suma por categoria coincide con el total del periodo y puede repartirse en
    porcentajes. Los tags dicen con quien, para que o en que contexto ocurrio el gasto,
    son cero o varios por transaccion y por tanto se solapan: sus importes nunca reparten
    un total. Ambos son catalogos del usuario, editables y compartidos entre sus
    transacciones.

    Todos los recursos financieros pertenecen al usuario autenticado y estan aislados
    entre usuarios. Salvo los endpoints de autenticacion, todas las operaciones exigen
    un token de acceso.
  version: 6.1.0
servers:
  - url: /
    description: Servidor local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Registro, autenticacion y renovacion de credenciales
  - name: transaction-types
    description: Consulta de tipos de transaccion
  - name: transactions
    description: Gestion y consulta de transacciones
  - name: categories
    description: Gestion del catalogo de categorias del usuario
  - name: tags
    description: Gestion del catalogo de tags del usuario
  - name: summary
    description: Agregados financieros calculados sobre las transacciones

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registra un usuario nuevo
      description: |
        Crea la cuenta y devuelve directamente las credenciales, de modo que el registro y
        el inicio de sesion son una sola llamada desde el cliente movil.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [auth]
      summary: Inicia sesion
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales emitidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renueva el token de acceso
      description: |
        Consume el token de refresco indicado y emite un par nuevo. El token consumido queda
        revocado, de modo que un token robado deja de servir en cuanto el usuario legitimo
        renueva.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Credenciales renovadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Cierra la sesion revocando el token de refresco
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Sesion cerrada
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/me:
    get:
      tags: [auth]
      summary: Devuelve el usuario autenticado
      operationId: getCurrentUser
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      summary: Actualiza los datos del usuario autenticado
      description: |
        Cambia el nombre con el que el usuario se presenta. El correo no se toca aqui: es
        la credencial con la que se entra, y cambiarlo obligaria a rehacer la identidad
        local y a reemitir las credenciales, que es otra operacion.
        Como en el resto de la API, un campo ausente se deja como esta; el nombre en blanco
        si es un cambio, y lo deja sin poner, que es el estado con el que puede nacer una
        cuenta.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transaction-types:
    get:
      tags: [transaction-types]
      summary: Lista los tipos de transaccion
      description: |
        Catalogo global cerrado de dos elementos, ingreso y egreso. El cliente deberia
        apoyarse en el campo code y no en el identificador numerico.
      operationId: listTransactionTypes
      responses:
        "200":
          description: Listado de tipos de transaccion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionTypeResponse"

  /transaction-types/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [transaction-types]
      summary: Obtiene un tipo de transaccion por su identificador
      operationId: getTransactionTypeById
      responses:
        "200":
          description: Tipo de transaccion encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionTypeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      tags: [categories]
      summary: Lista las categorias del usuario
      description: |
        Devuelve el catalogo completo de categorias del usuario, ordenado alfabeticamente,
        con el numero de transacciones que clasifica cada una.
        El catalogo se siembra al registrarse con un juego inicial de categorias y desde
        ahi es del usuario: puede anadir, renombrar y eliminar las que quiera.
      operationId: listCategories
      responses:
        "200":
          description: Listado de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
    post:
      tags: [categories]
      summary: Crea una categoria
      description: |
        El nombre debe estar libre dentro del catalogo del usuario sin distinguir
        mayusculas, igual que en los tags.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCategoryRequest"
      responses:
        "201":
          description: Categoria creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [categories]
      summary: Actualiza una categoria
      description: |
        Cambia el nombre o el tipo de movimiento al que se ofrece la categoria. El cambio
        alcanza a todas las transacciones que clasifica, porque la categoria es una sola y
        se comparte entre ellas.
        Los campos ausentes se dejan como estan. Renombrar a un nombre ya ocupado se
        rechaza en lugar de fusionar las dos categorias, para que la operacion nunca
        destruya informacion sin avisar.
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCategoryRequest"
      responses:
        "200":
          description: Categoria actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [categories]
      summary: Elimina una categoria
      description: |
        Elimina la categoria del catalogo. Las transacciones que clasificaba pasan a la
        categoria de reserva del usuario, la marcada con isSystem: como toda transaccion
        tiene exactamente una categoria, no pueden quedarse sin ninguna.
        La categoria de reserva no se puede eliminar.
      operationId: deleteCategory
      responses:
        "204":
          description: Categoria eliminada
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /tags:
    get:
      tags: [tags]
      summary: Lista los tags del usuario
      description: |
        Devuelve el catalogo completo de tags del usuario, ordenado alfabeticamente, con el
        numero de transacciones que lleva cada uno. Sirve para ofrecer autocompletado al
        escribir y para administrar el catalogo.
        Se incluyen los tags que todavia no usa ninguna transaccion, con transactionCount a
        cero: siguen ocupando su nombre, asi que el usuario debe poder verlos y borrarlos.
      operationId: listTags
      responses:
        "200":
          description: Listado de tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagResponse"
    post:
      tags: [tags]
      summary: Crea un tag en el catalogo del usuario
      description: |
        Alta explicita de un tag, para preparar el catalogo sin registrar una transaccion.
        No es la via habitual: los tags siguen naciendo al escribirlos dentro de una.
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTagRequest"
      responses:
        "201":
          description: Tag creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /tags/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [tags]
      summary: Renombra un tag
      description: |
        Cambia el nombre del tag en todas las transacciones que lo llevan, porque el tag es
        uno solo y se comparte entre ellas.
        El nombre debe seguir libre dentro del catalogo del usuario sin distinguir
        mayusculas: renombrar a un nombre ya existente se rechaza en lugar de fusionar los
        dos tags, para que la operacion nunca destruya informacion sin avisar.
      operationId: updateTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTagRequest"
      responses:
        "200":
          description: Tag renombrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [tags]
      summary: Elimina un tag
      description: |
        Elimina el tag del catalogo y lo retira de todas las transacciones que lo llevan.
        Las transacciones no se tocan: solo dejan de estar clasificadas por el.
      operationId: deleteTag
      responses:
        "204":
          description: Tag eliminado
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions:
    get:
      tags: [transactions]
      summary: Lista transacciones filtradas y paginadas
      description: |
        Todos los filtros son opcionales y se combinan con AND.
        Los parametros month y year son un atajo para acotar a un mes natural completo
        y no pueden combinarse con dateFrom o dateTo.
      operationId: listTransactions
      parameters:
        - $ref: "#/components/parameters/MonthFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DateFromFilter"
        - $ref: "#/components/parameters/DateToFilter"
        - $ref: "#/components/parameters/TransactionTypeIdFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/TagFilter"
        - name: page
          in: query
          description: Numero de pagina, empezando en cero
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Cantidad de elementos por pagina
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            Criterio de ordenamiento con formato campo,direccion.
            Campos admitidos date, amount e id. Direcciones asc y desc.
          required: false
          schema:
            type: string
            default: date,desc
      responses:
        "200":
          description: Pagina de transacciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [transactions]
      summary: Crea una transaccion
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaccion creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions/summary:
    get:
      tags: [summary]
      summary: Resume las transacciones que cumplen los filtros
      description: |
        Devuelve los totales de ingresos y egresos del periodo y su desglose por tag, sin
        paginar y sin traerse las transacciones. Acepta exactamente los mismos filtros que
        el listado y los combina igual, de modo que un resumen siempre corresponde con lo
        que devolveria el listado con esos mismos filtros.

        Los importes de byTag no suman el total: una transaccion con varios tags aporta su
        importe integro a cada uno, porque el modelo no define como repartirlo. El cliente
        debe presentarlo como gasto por tag y no como un reparto porcentual del total.
      operationId: getTransactionSummary
      parameters:
        - $ref: "#/components/parameters/MonthFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DateFromFilter"
        - $ref: "#/components/parameters/DateToFilter"
        - $ref: "#/components/parameters/TransactionTypeIdFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/TagFilter"
      responses:
        "200":
          description: Resumen del periodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /transactions/summary/series:
    get:
      tags: [summary]
      summary: Resume las transacciones agrupadas por tramos de tiempo
      description: |
        Agrupa ingresos y egresos en tramos consecutivos del tamanio indicado por
        granularity, para dibujar la evolucion financiera.
        Solo se devuelven los tramos que tienen alguna transaccion: el cliente conoce el
        rango y la granularidad, asi que puede completar los huecos con ceros sin que el
        servidor tenga que materializar tramos vacios.
      operationId: getTransactionSummarySeries
      parameters:
        - $ref: "#/components/parameters/MonthFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DateFromFilter"
        - $ref: "#/components/parameters/DateToFilter"
        - $ref: "#/components/parameters/TransactionTypeIdFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/TagFilter"
        - name: granularity
          in: query
          description: Tamanio de cada tramo
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/SummaryGranularity"
            default: MONTH
      responses:
        "200":
          description: Serie temporal del periodo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarySeriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [transactions]
      summary: Obtiene una transaccion por su identificador
      operationId: getTransactionById
      responses:
        "200":
          description: Transaccion encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [transactions]
      summary: Actualiza parcialmente una transaccion
      description: |
        Solo se modifican los campos presentes en la peticion.
        Si tags esta presente reemplaza por completo los tags de la transaccion;
        si se omite, los tags actuales se conservan.
      operationId: updateTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"
      responses:
        "200":
          description: Transaccion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [transactions]
      summary: Elimina una transaccion
      description: |
        La transaccion se elimina fisicamente junto con sus tags, que no existen fuera
        de ella.
      operationId: deleteTransaction
      responses:
        "204":
          description: Transaccion eliminada
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por /auth/login o /auth/refresh

  parameters:
    PathId:
      name: id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        format: int64
    MonthFilter:
      name: month
      in: query
      description: Mes de la transaccion, entre 1 y 12
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 12
    YearFilter:
      name: year
      in: query
      description: Anio de la transaccion
      required: false
      schema:
        type: integer
        minimum: 1970
        maximum: 9999
    DateFromFilter:
      name: dateFrom
      in: query
      description: Fecha inicial inclusiva
      required: false
      schema:
        type: string
        format: date-time
    DateToFilter:
      name: dateTo
      in: query
      description: Fecha final inclusiva
      required: false
      schema:
        type: string
        format: date-time
    TransactionTypeIdFilter:
      name: transactionTypeId
      in: query
      description: Filtra por tipo de transaccion
      required: false
      schema:
        type: integer
        format: int64
    CategoryIdFilter:
      name: categoryId
      in: query
      description: Filtra por categoria principal
      required: false
      schema:
        type: integer
        format: int64
    TagFilter:
      name: tag
      in: query
      description: |
        Devuelve unicamente las transacciones que llevan el tag indicado.
        La comparacion no distingue mayusculas de minusculas.
      required: false
      schema:
        type: string
        maxLength: 70

  responses:
    BadRequest:
      description: La peticion es sintacticamente invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Las credenciales faltan, han caducado o no son validas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: La operacion entra en conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Longitud minima de 8 caracteres. El maximo de 72 lo impone el algoritmo de
            hashing BCrypt, que ignora los caracteres posteriores.
        displayName:
          type: string
          maxLength: 70

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      description: Credenciales del usuario autenticado
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Token de acceso que debe enviarse en la cabecera Authorization
        refreshToken:
          type: string
          description: Token de un solo uso para obtener un par nuevo sin volver a autenticarse
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Segundos de validez restantes del token de acceso
        user:
          $ref: "#/components/schemas/UserResponse"

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 70
          description: |
            Nombre con el que el usuario se presenta en la aplicacion. En blanco lo deja
            sin poner.

    UserResponse:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string

    TransactionTypeResponse:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Nombre para mostrar, por ejemplo Ingreso
        code:
          type: string
          description: |
            Codigo estable del tipo. Determina el signo del importe en los calculos.
          enum: [INCOME, EXPENSE]

    CategoryScope:
      type: string
      description: |
        Tipo de movimiento al que se ofrece una categoria. BOTH la ofrece en los dos.
        Solo decide que categorias propone el formulario de registro; no restringe lo que
        ya esta guardado.
      enum: [EXPENSE, INCOME, BOTH]

    CategoryResponse:
      type: object
      description: Categoria del catalogo del usuario
      required: [id, name, appliesTo, isSystem, transactionCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        appliesTo:
          $ref: "#/components/schemas/CategoryScope"
        isSystem:
          type: boolean
          description: |
            Categoria de reserva del usuario. Recibe las transacciones de las categorias
            que se eliminan y por eso no puede eliminarse ella misma.
        transactionCount:
          type: integer
          format: int64
          description: Cuantas transacciones del usuario clasifica esta categoria

    SaveCategoryRequest:
      type: object
      description: Cuerpo de alta y de actualizacion de una categoria
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 70
        appliesTo:
          $ref: "#/components/schemas/CategoryScope"

    TransactionResponse:
      type: object
      required: [id, amount, date, transactionType, category, tags]
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          description: Importe monetario con dos decimales, siempre positivo
        description:
          type: string
        date:
          type: string
          format: date-time
        transactionType:
          $ref: "#/components/schemas/TransactionTypeResponse"
        category:
          $ref: "#/components/schemas/CategoryResponse"
        tags:
          type: array
          description: Tags de la transaccion, en orden alfabetico
          items:
            type: string

    CreateTransactionRequest:
      type: object
      required: [amount, transactionTypeId, categoryId]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        description:
          type: string
          maxLength: 255
        date:
          type: string
          format: date-time
          description: Fecha de la transaccion. Si se omite se usa la fecha actual.
        transactionTypeId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
          description: |
            Categoria principal, obligatoria. Debe pertenecer al usuario y admitir el tipo
            de la transaccion.
        tags:
          type: array
          description: |
            Tags de texto libre. Se recortan los espacios sobrantes, se descartan los que
            quedan en blanco y los repetidos se ignoran sin distinguir mayusculas.
            Una cadena vacia no llega a descartarse: la rechaza la longitud minima.
            Si el usuario ya tiene el tag escrito de otra forma se reutiliza el existente,
            asi que `casa` sobre un `Casa` previo devuelve `Casa`.
          items:
            type: string
            minLength: 1
            maxLength: 70

    UpdateTransactionRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        description:
          type: string
          maxLength: 255
        date:
          type: string
          format: date-time
        transactionTypeId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
          description: |
            Cambia la categoria principal. Debe pertenecer al usuario y admitir el tipo
            que tendra la transaccion despues de la actualizacion.
        tags:
          type: array
          description: |
            Si esta presente reemplaza por completo los tags de la transaccion.
            Una lista vacia deja la transaccion sin tags.
          items:
            type: string
            minLength: 1
            maxLength: 70

    TransactionPageResponse:
      type: object
      description: Pagina de transacciones con sus metadatos de paginacion
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    TagResponse:
      type: object
      description: Tag del catalogo del usuario
      required: [id, name, transactionCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        transactionCount:
          type: integer
          format: int64
          description: Cuantas transacciones del usuario llevan este tag

    SaveTagRequest:
      type: object
      description: Nombre de un tag al crearlo o al renombrarlo
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 70
          description: |
            Se recortan los espacios sobrantes. No puede coincidir con otro tag del mismo
            usuario sin distinguir mayusculas.

    TransactionSummaryResponse:
      type: object
      description: Totales del periodo y sus desgloses por categoria y por tag
      required: [income, expense, net, transactionCount, byCategory, byTag]
      properties:
        income:
          type: number
          description: Suma de los importes de tipo INCOME, siempre positiva
        expense:
          type: number
          description: Suma de los importes de tipo EXPENSE, siempre positiva
        net:
          type: number
          description: Diferencia entre income y expense, negativa si se gasto de mas
        transactionCount:
          type: integer
          format: int64
        byCategory:
          type: array
          description: |
            Desglose por categoria, ordenado de mayor a menor egreso. Como cada
            transaccion tiene exactamente una categoria, sus importes suman el total del
            periodo y pueden presentarse como un reparto porcentual.
          items:
            $ref: "#/components/schemas/CategorySummaryResponse"
        byTag:
          type: array
          description: |
            Desglose por tag, ordenado de mayor a menor egreso. Sus importes no suman el
            total del periodo, porque una transaccion con varios tags aporta su importe
            integro a cada uno. Es un analisis de contexto y no una distribucion del
            gasto: para eso esta byCategory.
          items:
            $ref: "#/components/schemas/TagSummaryResponse"

    CategorySummaryResponse:
      type: object
      description: Ingresos y egresos acumulados por una categoria dentro del periodo
      required: [categoryId, category, income, expense, transactionCount]
      properties:
        categoryId:
          type: integer
          format: int64
        category:
          type: string
          description: Nombre de la categoria
        income:
          type: number
        expense:
          type: number
        transactionCount:
          type: integer
          format: int64

    TagSummaryResponse:
      type: object
      description: Ingresos y egresos acumulados por un tag dentro del periodo
      required: [income, expense, transactionCount]
      properties:
        tag:
          type: string
          nullable: true
          description: Nombre del tag, o nulo para las transacciones que no llevan ninguno
        income:
          type: number
        expense:
          type: number
        transactionCount:
          type: integer
          format: int64

    SummaryGranularity:
      type: string
      description: Tamanio de cada tramo de una serie temporal
      enum: [DAY, WEEK, MONTH]

    SummarySeriesResponse:
      type: object
      description: Evolucion de ingresos y egresos a lo largo del periodo
      required: [granularity, buckets]
      properties:
        granularity:
          $ref: "#/components/schemas/SummaryGranularity"
        buckets:
          type: array
          description: Tramos con alguna transaccion, en orden cronologico
          items:
            $ref: "#/components/schemas/SummaryBucketResponse"

    SummaryBucketResponse:
      type: object
      description: Totales de un tramo de la serie
      required: [periodStart, income, expense, net, transactionCount]
      properties:
        periodStart:
          type: string
          format: date-time
          description: Instante inicial del tramo, inclusivo
        income:
          type: number
        expense:
          type: number
        net:
          type: number
        transactionCount:
          type: integer
          format: int64

    ErrorResponse:
      type: object
      description: Respuesta de error estructurada
      required: [timestamp, status, code, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
          description: Codigo estable de negocio, por ejemplo TRANSACTION_NOT_FOUND
        message:
          type: string
