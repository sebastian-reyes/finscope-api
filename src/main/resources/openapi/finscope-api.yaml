openapi: 3.0.3
info:
  title: FinScope API
  description: |
    API reactiva de FinScope para la gestion de finanzas personales.

    El modelo se reduce a tres piezas: la transaccion, su tipo y sus tags.
    El tipo es un catalogo cerrado de dos valores, ingreso y egreso, porque de el
    depende el signo del importe. Los tags son texto libre y pertenecen a una unica
    transaccion, de modo que clasificar no obliga a mantener un catalogo previo.

    Todos los recursos financieros pertenecen al usuario autenticado y estan aislados
    entre usuarios. Salvo los endpoints de autenticacion, todas las operaciones exigen
    un token de acceso.
  version: 4.0.0
servers:
  - url: /
    description: Servidor local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Registro, autenticacion y renovacion de credenciales
  - name: transaction-types
    description: Consulta de tipos de transaccion
  - name: transactions
    description: Gestion y consulta de transacciones
  - name: tags
    description: Consulta de los tags en uso

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registra un usuario nuevo
      description: |
        Crea la cuenta y devuelve directamente las credenciales, de modo que el registro y
        el inicio de sesion son una sola llamada desde el cliente movil.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [auth]
      summary: Inicia sesion
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales emitidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renueva el token de acceso
      description: |
        Consume el token de refresco indicado y emite un par nuevo. El token consumido queda
        revocado, de modo que un token robado deja de servir en cuanto el usuario legitimo
        renueva.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Credenciales renovadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Cierra la sesion revocando el token de refresco
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Sesion cerrada
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/me:
    get:
      tags: [auth]
      summary: Devuelve el usuario autenticado
      operationId: getCurrentUser
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transaction-types:
    get:
      tags: [transaction-types]
      summary: Lista los tipos de transaccion
      description: |
        Catalogo global cerrado de dos elementos, ingreso y egreso. El cliente deberia
        apoyarse en el campo code y no en el identificador numerico.
      operationId: listTransactionTypes
      responses:
        "200":
          description: Listado de tipos de transaccion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionTypeResponse"

  /transaction-types/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [transaction-types]
      summary: Obtiene un tipo de transaccion por su identificador
      operationId: getTransactionTypeById
      responses:
        "200":
          description: Tipo de transaccion encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionTypeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /tags:
    get:
      tags: [tags]
      summary: Lista los tags que el usuario ya ha usado
      description: |
        Devuelve los nombres distintos de tag presentes en las transacciones del usuario,
        ordenados alfabeticamente. Sirve para ofrecer autocompletado al escribir; no es un
        catalogo, porque los tags se crean al vuelo dentro de cada transaccion.
      operationId: listTags
      responses:
        "200":
          description: Listado de nombres de tag
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /transactions:
    get:
      tags: [transactions]
      summary: Lista transacciones filtradas y paginadas
      description: |
        Todos los filtros son opcionales y se combinan con AND.
        Los parametros month y year son un atajo para acotar a un mes natural completo
        y no pueden combinarse con dateFrom o dateTo.
      operationId: listTransactions
      parameters:
        - name: month
          in: query
          description: Mes de la transaccion, entre 1 y 12
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          description: Anio de la transaccion
          required: false
          schema:
            type: integer
            minimum: 1970
            maximum: 9999
        - name: dateFrom
          in: query
          description: Fecha inicial inclusiva
          required: false
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          description: Fecha final inclusiva
          required: false
          schema:
            type: string
            format: date-time
        - name: transactionTypeId
          in: query
          description: Filtra por tipo de transaccion
          required: false
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          description: |
            Devuelve unicamente las transacciones que llevan el tag indicado.
            La comparacion no distingue mayusculas de minusculas.
          required: false
          schema:
            type: string
            maxLength: 70
        - name: page
          in: query
          description: Numero de pagina, empezando en cero
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Cantidad de elementos por pagina
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            Criterio de ordenamiento con formato campo,direccion.
            Campos admitidos date, amount e id. Direcciones asc y desc.
          required: false
          schema:
            type: string
            default: date,desc
      responses:
        "200":
          description: Pagina de transacciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [transactions]
      summary: Crea una transaccion
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaccion creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [transactions]
      summary: Obtiene una transaccion por su identificador
      operationId: getTransactionById
      responses:
        "200":
          description: Transaccion encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [transactions]
      summary: Actualiza parcialmente una transaccion
      description: |
        Solo se modifican los campos presentes en la peticion.
        Si tags esta presente reemplaza por completo los tags de la transaccion;
        si se omite, los tags actuales se conservan.
      operationId: updateTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"
      responses:
        "200":
          description: Transaccion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [transactions]
      summary: Elimina una transaccion
      description: |
        La transaccion se elimina fisicamente junto con sus tags, que no existen fuera
        de ella.
      operationId: deleteTransaction
      responses:
        "204":
          description: Transaccion eliminada
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por /auth/login o /auth/refresh

  parameters:
    PathId:
      name: id
      in: path
      description: Identificador del recurso
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: La peticion es sintacticamente invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Las credenciales faltan, han caducado o no son validas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: La operacion entra en conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Longitud minima de 8 caracteres. El maximo de 72 lo impone el algoritmo de
            hashing BCrypt, que ignora los caracteres posteriores.
        displayName:
          type: string
          maxLength: 70

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      description: Credenciales del usuario autenticado
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Token de acceso que debe enviarse en la cabecera Authorization
        refreshToken:
          type: string
          description: Token de un solo uso para obtener un par nuevo sin volver a autenticarse
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Segundos de validez restantes del token de acceso
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string

    TransactionTypeResponse:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Nombre para mostrar, por ejemplo Ingreso
        code:
          type: string
          description: |
            Codigo estable del tipo. Determina el signo del importe en los calculos.
          enum: [INCOME, EXPENSE]

    TransactionResponse:
      type: object
      required: [id, amount, date, transactionType, tags]
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          description: Importe monetario con dos decimales, siempre positivo
        description:
          type: string
        date:
          type: string
          format: date-time
        transactionType:
          $ref: "#/components/schemas/TransactionTypeResponse"
        tags:
          type: array
          description: Tags de la transaccion, en orden alfabetico
          items:
            type: string

    CreateTransactionRequest:
      type: object
      required: [amount, transactionTypeId]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        description:
          type: string
          maxLength: 255
        date:
          type: string
          format: date-time
          description: Fecha de la transaccion. Si se omite se usa la fecha actual.
        transactionTypeId:
          type: integer
          format: int64
        tags:
          type: array
          description: |
            Tags de texto libre. Se recortan los espacios sobrantes, se descartan los
            vacios y los repetidos se ignoran.
          items:
            type: string
            minLength: 1
            maxLength: 70

    UpdateTransactionRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        description:
          type: string
          maxLength: 255
        date:
          type: string
          format: date-time
        transactionTypeId:
          type: integer
          format: int64
        tags:
          type: array
          description: |
            Si esta presente reemplaza por completo los tags de la transaccion.
            Una lista vacia deja la transaccion sin tags.
          items:
            type: string
            minLength: 1
            maxLength: 70

    TransactionPageResponse:
      type: object
      description: Pagina de transacciones con sus metadatos de paginacion
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      description: Respuesta de error estructurada
      required: [timestamp, status, code, message]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
          description: Codigo estable de negocio, por ejemplo TRANSACTION_NOT_FOUND
        message:
          type: string
