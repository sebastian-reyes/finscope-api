# Configuracion de produccion.
#
# Ningun valor sensible o dependiente del entorno tiene defecto a proposito: si falta una
# variable la aplicacion no arranca, que es preferible a que arranque apuntando a otro sitio
# o firmando con una clave conocida. Todo lo que hay aqui son referencias a variables de
# entorno; el archivo puede vivir en el repositorio sin contener ningun secreto.
spring:
  r2dbc:
    # Se admiten las dos formas: DB_URL completa --- que es lo que suele entregar un
    # PostgreSQL administrado --- o las piezas sueltas. Con proveedor gestionado el cifrado
    # de la conexion no es opcional, de ahi que sslMode venga exigido por defecto.
    url: ${DB_URL:r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslMode=${DB_SSL_MODE:require}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      # Valores conservadores: un PostgreSQL administrado de plan pequeno admite pocas
      # conexiones simultaneas y agotarlas deja fuera al resto de la aplicacion.
      initial-size: ${DB_POOL_INITIAL_SIZE:2}
      max-size: ${DB_POOL_MAX_SIZE:10}
      max-acquire-time: ${DB_POOL_MAX_ACQUIRE_TIME:10s}
      max-idle-time: ${DB_POOL_MAX_IDLE_TIME:30m}
      max-life-time: ${DB_POOL_MAX_LIFE_TIME:2h}
      validation-query: SELECT 1
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    # Es de los pocos ajustes de produccion con valor por defecto, y a proposito: sin
    # MAIL_HOST la aplicacion arranca igual y el resto de FinScope funciona, solo que ningun
    # correo sale y cada envio deja un aviso en el registro. Un servidor de correo caido no
    # deberia impedir registrar un gasto.
    host: ${MAIL_HOST:}
    # 587 es el puerto normal, pero no sirve en todas partes: Render lo bloquea junto al 25 y
    # al 465. Por eso el puerto y el modo de cifrado son variables --- 2587 o 2525 con
    # STARTTLS, 2465 con SSL directo --- y cambiar de uno a otro no toca ningun archivo.
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      # Los dos son excluyentes: STARTTLS empieza en claro y sube a cifrado, SSL va cifrado
      # desde el saludo. Encender los dos a la vez deja la conexion colgada.
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      # Sin esto, un servidor que no conteste deja la peticion esperando hasta que el sistema
      # se canse, que son minutos. El envio no bloquea la respuesta, pero si ocupa un hilo.
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECT_TIMEOUT:10000}
      mail.smtp.timeout: ${MAIL_SMTP_READ_TIMEOUT:10000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}
finscope:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      # Debe apuntar al dominio real de FinScope. Sin esta variable ningun navegador podra
      # consumir la API, que es el fallo correcto: preferible a dejar la puerta abierta.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_FROM}
    # El dominio real de la aplicacion web. Sin el, los enlaces de los correos llevarian al
    # localhost de quien los recibe, que es peor que no mandarlos.
    app-base-url: ${APP_BASE_URL}
management:
  endpoint:
    health:
      # El estado se publica sin desglose: el detalle nombra la base de datos y sus
      # componentes, y este endpoint es accesible sin credenciales.
      show-details: never
      show-components: never
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sreyes.finscope: ${LOG_LEVEL_APP:INFO}
    # El nivel del driver no se deja al entorno. Estas dos categorias vuelcan la sentencia y
    # los parametros enlazados --- entre ellos el hash de la contrasena y el del token de
    # refresco --- en cuanto bajan a DEBUG, asi que en produccion quedan fijadas por encima
    # de ese umbral y subir LOG_LEVEL_ROOT para diagnosticar otra cosa no puede destaparlas.
    io.r2dbc.postgresql.QUERY: WARN
    io.r2dbc.postgresql.PARAM: WARN
    org.springframework.r2dbc: INFO
