spring:
  application:
    name: finscope-api
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: ${DB_POOL_INITIAL_SIZE:5}
      max-size: ${DB_POOL_MAX_SIZE:20}
      max-acquire-time: ${DB_POOL_MAX_ACQUIRE_TIME:10s}
      max-idle-time: ${DB_POOL_MAX_IDLE_TIME:30m}
      max-life-time: ${DB_POOL_MAX_LIFE_TIME:2h}
  codec:
    # Tope de lo que se acumula en memoria por peticion. Los cuerpos de esta API son
    # objetos pequenos, asi que cualquier cosa mayor no es un uso legitimo sino una forma
    # barata de agotar la memoria del servidor.
    max-in-memory-size: ${MAX_REQUEST_SIZE:256KB}
server:
  port: ${SERVER_PORT:9090}
  # TLS termina en el proxy inverso: sin esto la aplicacion veria todas las peticiones como
  # http y con la direccion del proxy, y ni HSTS ni el limite por origen funcionarian.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  max-http-request-header-size: ${MAX_REQUEST_HEADER_SIZE:16KB}
  shutdown: graceful
finscope:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:finscope-api}
      audience: ${JWT_AUDIENCE:finscope-web}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    cors:
      # En produccion debe apuntarse al dominio real de FinScope mediante la variable de
      # entorno. El valor por defecto solo sirve al servidor de desarrollo de Angular.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      max-age: ${CORS_MAX_AGE:1h}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      auth:
        capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
        window: ${RATE_LIMIT_AUTH_WINDOW:1m}
      api:
        capacity: ${RATE_LIMIT_API_CAPACITY:300}
        window: ${RATE_LIMIT_API_WINDOW:1m}
    login-attempts:
      enabled: ${LOGIN_ATTEMPTS_ENABLED:true}
      max-attempts: ${LOGIN_ATTEMPTS_MAX:5}
      initial-lock: ${LOGIN_ATTEMPTS_INITIAL_LOCK:30s}
      max-lock: ${LOGIN_ATTEMPTS_MAX_LOCK:15m}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sreyes.finscope: ${LOG_LEVEL_APP:INFO}
    # Estas categorias registran las sentencias y sus parametros enlazados, que en esta
    # aplicacion incluyen el hash de la contrasena y el del token de refresco. Se fijan a
    # INFO para que no basten un DEBUG global o un descuido para acabar volcandolos.
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql.QUERY: INFO
    io.r2dbc.postgresql.PARAM: INFO
