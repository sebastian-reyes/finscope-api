spring:
  application:
    name: finscope-api
  r2dbc:
    url: r2dbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
server:
  port: ${SERVER_PORT:9090}
finscope:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: finscope-api
      access-token-ttl: 15m
      refresh-token-ttl: 30d